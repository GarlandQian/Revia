[package]
name = "revia"
version = "0.0.2"
description = "Revia：轻量的 macOS Git 客户端"
authors = ["Garland Qian"]
edition = "2024"

[lib]
name = "revia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5.3"
two-face = { version = "0.5", features = ["syntect-default-onig"] }
sha2 = "0.11"
wait-timeout = "0.2"
tempfile = "3"
notify = "8"
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
# ADR-0014: refs/stash deletion only; transport features stay disabled.
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
portable-pty = "0.9"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "crypto-rust"] }
minisign-verify = "0.2"
tauri-plugin-updater = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
url = "2"
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSLocale", "NSArray", "NSString", "NSGeometry", "NSValue", "NSKeyValueCoding", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSColor", "NSGraphics", "NSGlassEffectView", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
# 判断 Windows 11（Mica 从 build 22000 起才有）；Tauri 的 window-vibrancy 已经依赖它。
windows-version = "0.1"

# 只构建 Apple Silicon（Q44）
[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = true


[dev-dependencies]
minisign = "0.7"
# 只在测试目标启用 mock app（任务 04 的真实 PTY 读写验证），不影响 release 构建。
tauri = { version = "2", features = ["test"] }
